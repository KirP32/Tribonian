name: Test and build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --extra dev --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Build Windows desktop app
        if: runner.os == 'Windows'
        run: uv run pyinstaller --noconfirm --clean --windowed --onedir --name Tribonian --copy-metadata gdown --collect-all pypdfium2 --collect-all pypdfium2_raw run_app.py
      - name: Packaged app startup check
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $appProcess = Start-Process -FilePath ".\dist\Tribonian\Tribonian.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $appProcess.WaitForExit(60000)) {
            $appProcess.Kill()
            throw "Packaged app did not exit in time"
          }
          if ($appProcess.ExitCode -ne 0) {
            throw "Packaged app exited with code $($appProcess.ExitCode)"
          }
      - name: Include launch instructions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item .env.example dist/Tribonian/.env.example
          Copy-Item README.md dist/Tribonian/README.md
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Tribonian-Windows
          path: dist/Tribonian/
          include-hidden-files: true
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Tribonian-Windows
          path: Tribonian
      - name: Prepare release archive
        run: |
          test -f Tribonian/Tribonian.exe
          test -d Tribonian/_internal
          test -f Tribonian/.env.example
          zip -qr Tribonian-Windows-x64.zip Tribonian
          unzip -tq Tribonian-Windows-x64.zip
          sha256sum Tribonian-Windows-x64.zip > SHA256SUMS.txt
          cat > release-notes.md <<'EOF'
          Готовая программа для Windows x64. Установка Python не требуется.

          1. Скачайте `Tribonian-Windows-x64.zip` из раздела Assets.
          2. Распакуйте архив целиком и откройте `Tribonian/Tribonian.exe`.
          3. Вставьте свой ключ OpenRouter, выберите папку или ссылку Google Drive и нажмите «Создать Summary».

          Папка `_internal` должна оставаться рядом с `.exe`. API-ключ в сборку не включён.

          Сборка прошла автотесты на Windows и Linux, а также проверку запуска готового EXE.
          EOF
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Tribonian $RELEASE_TAG для Windows" \
            --notes-file release-notes.md \
            Tribonian-Windows-x64.zip SHA256SUMS.txt
