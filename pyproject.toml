[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tribonian"
version = "1.0.0"
description = "Desktop folder summaries with Google Drive and multimodal OpenRouter"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "requests>=2.32,<3",
    "gdown>=6.4.2,<7",
    "pypdfium2>=4.30,<6",
    "python-docx>=1.1,<2",
    "python-pptx>=1,<2",
    "openpyxl>=3.1,<4",
    "Pillow>=11,<14",
    "charset-normalizer>=3.4,<4",
    "beautifulsoup4>=4.12,<5",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "pyinstaller>=6,<7"]

[project.scripts]
tribonian = "tribonian.gui:main"
tribonian-cli = "tribonian.cli:main"

[tool.setuptools.packages.find]
include = ["tribonian*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
